# Configuração do Nginx que serve o frontend dentro do Docker.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Qualquer caminho que não for um arquivo existente devolve o index.html (padrão de app React).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
