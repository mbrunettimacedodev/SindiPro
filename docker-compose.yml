# Banco de dados local do SindiPro (PostgreSQL 16) — para rodar o projeto sem Supabase.
# Uso:  docker compose up -d      (sobe o banco)
#       docker compose down -v    (desliga E apaga os dados, para recomeçar do zero)
#
# Na PRIMEIRA vez que o container sobe, o Postgres roda sozinho os scripts abaixo, em ordem:
#   01-schema.sql  -> cria as tabelas
#   02-dados.sql   -> insere dados de exemplo
services:
  banco:
    image: postgres:16-alpine
    container_name: sindipro-banco
    environment:
      POSTGRES_DB: sindipro
      POSTGRES_USER: sindipro
      POSTGRES_PASSWORD: sindipro # senha só de desenvolvimento local
    ports:
      - "5432:5432"
    volumes:
      - dados-sindipro:/var/lib/postgresql/data
      - ./backend/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./backend/sql/dados-exemplo.sql:/docker-entrypoint-initdb.d/02-dados.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sindipro -d sindipro"]
      interval: 5s
      retries: 10

volumes:
  dados-sindipro:
