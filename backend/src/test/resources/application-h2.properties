# Perfil "h2": usado só nos testes e para experimentar a API sem o Supabase.
# O Hibernate cria as tabelas sozinho a partir das entidades (create-drop = apaga ao desligar).
spring.datasource.url=jdbc:h2:mem:sindipro;DB_CLOSE_DELAY=-1
# O application.properties principal fixa o driver do PostgreSQL; aqui trocamos para o do H2.
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
