# ---------------------------------------------------------------------------
# Banco de dados
# ${NOME:padrao} = usa a variável NOME se existir; se não, usa o padrão.
# O padrão aponta para o banco LOCAL do docker-compose.yml (é o que o professor vai usar).
#
# Para continuar usando o Supabase na SUA máquina, crie o arquivo backend/segredos.properties
# (ele está no .gitignore e NUNCA vai para o GitHub) com:
#   DB_URL=jdbc:postgresql://<host-do-supabase>:5432/postgres?sslmode=require
#   DB_USER=<usuario>
#   DB_PASSWORD=<senha>
# ---------------------------------------------------------------------------
spring.config.import=optional:file:segredos.properties,optional:file:backend/segredos.properties

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sindipro}
spring.datasource.username=${DB_USER:sindipro}
spring.datasource.password=${DB_PASSWORD:sindipro}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=5
spring.jpa.hibernate.ddl-auto=update

# Usuário administrador criado automaticamente se a tabela "usuario" estiver vazia.
# Troque por variáveis de ambiente em produção.
sindipro.admin.email=${ADMIN_EMAIL:admin@sindipro.com}
sindipro.admin.senha=${ADMIN_SENHA:admin123}
